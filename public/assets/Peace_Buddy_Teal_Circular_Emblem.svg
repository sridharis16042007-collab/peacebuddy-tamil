<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" role="img" aria-label="Peace Buddy Circular Emblem">
  <defs>
    <!-- Outer Ring Gradient for smooth mindful depth -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1583C7" />
      <stop offset="100%" stop-color="#106DA7" />
    </linearGradient>
    
    <!-- Navy Disc Gradient -->
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4477" />
      <stop offset="100%" stop-color="#072644" />
    </linearGradient>

    <!-- Soft Inner Shadow / Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Outer Ring Blue Circle -->
  <circle cx="250" cy="250" r="236" fill="none" stroke="url(#ringGrad)" stroke-width="20" />

  <!-- Inner Navy Circle -->
  <circle cx="250" cy="250" r="218" fill="url(#navyGrad)" />

  <!-- Stylised White 'B' with Quill Stroke & Olive Leaves -->
  <g fill="#FFFFFF" filter="url(#softGlow)">
    <!-- Quill Stem of the B (Curving elegant stroke) -->
    <path d="M 180 120 
             C 178 170, 175 320, 185 365 
             C 188 375, 175 385, 168 378 
             C 155 360, 158 220, 168 135 
             C 170 118, 182 108, 180 120 Z" />

    <!-- Upper loop of the 'B' -->
    <path d="M 178 135 
             C 225 125, 305 130, 310 185 
             C 314 225, 260 248, 180 248 
             L 180 220 
             C 240 220, 278 208, 275 182 
             C 272 158, 220 152, 178 156 Z" />

    <!-- Lower loop of the 'B' (Generous, grounding, peaceful) -->
    <path d="M 180 238 
             C 265 238, 332 255, 332 305 
             C 332 360, 248 375, 180 372 
             L 180 345 
             C 235 348, 298 338, 298 305 
             C 298 272, 235 264, 180 264 Z" />

    <!-- Quill nib flourish at the tip -->
    <path d="M 174 116 
             C 177 106, 185 106, 188 116 
             C 185 124, 177 124, 174 116 Z" />
    
    <!-- Olive Branch with Serene Leaves on the left / lower stem -->
    <!-- Leaf 1 (upper left) -->
    <path d="M 160 210 C 130 195, 120 175, 135 165 C 150 175, 162 195, 160 210 Z" opacity="0.95" />
    <!-- Leaf 2 (mid left) -->
    <path d="M 162 255 C 125 250, 110 235, 122 220 C 142 228, 158 245, 162 255 Z" opacity="0.95" />
    <!-- Leaf 3 (lower left) -->
    <path d="M 168 300 C 132 305, 118 325, 130 338 C 148 328, 162 312, 168 300 Z" opacity="0.95" />
    <!-- Leaf 4 (sprout near base) -->
    <path d="M 175 348 C 145 365, 138 385, 155 392 C 168 378, 175 362, 175 348 Z" opacity="0.95" />
    <!-- Leaf 5 (gentle interior sprout) -->
    <path d="M 188 190 C 205 180, 218 185, 215 198 C 202 202, 192 198, 188 190 Z" opacity="0.9" />
  </g>
</svg>
